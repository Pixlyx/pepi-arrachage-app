<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrachage</title>
<style>
:root{--bg:#eef1ec;--card:#fff;--ink:#1f2a22;--soft:#6b786e;--line:#d3dbd2;--green:#2f6b3f;--done:#e3eee2;--danger:#a4372b;--head:#dde5db;--p1:#b85f00;--p1bg:#fdeed9;--p2:#c0281c;--p2bg:#fde3e0}
@media (prefers-color-scheme:dark){:root{--bg:#141a16;--card:#1d2620;--ink:#e6ece7;--soft:#93a197;--line:#2f3b33;--green:#6fbf84;--done:#223428;--danger:#e0816f;--head:#27332b;--p1:#f0a040;--p1bg:#3a2d17;--p2:#ff7a6b;--p2bg:#3d1f1c}li.p1 .check,li.p2 .check{color:#1b1b1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:12px 16px 90px}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.tabs button{flex:1;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:10px 4px;font-size:15px;line-height:1.2}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.tabs small{display:block;font-weight:500;opacity:.85}
h1{font-size:24px;margin:6px 0 2px}
.count{color:var(--soft);margin:0 0 14px}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,select{font:inherit;padding:14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--green)}
#new{flex:1 1 100%;min-width:0}
#qty{width:80px;flex:none;text-align:center;padding:14px 8px}
#sec{flex:1;min-width:0}
button{font:inherit;border:0;border-radius:10px;padding:14px 18px;background:var(--green);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--soft);border:1px solid var(--line);padding:10px 14px;font-weight:500;font-size:15px}
.sechead{display:flex;align-items:center;gap:8px;background:var(--head);border-radius:12px;padding:6px 6px 6px 14px;margin:16px 0 8px}
.sechead .tog{flex:1;min-width:0;background:none;color:var(--ink);text-align:left;padding:10px 0;display:flex;align-items:baseline;gap:10px;font-size:18px;font-weight:700}
.sechead .tog small{font-size:14px;color:var(--soft);font-weight:500;white-space:nowrap}
.sechead .tog .nm{overflow:hidden;text-overflow:ellipsis}
.sechead .ghost{padding:8px 10px;font-size:14px}
ul{list-style:none;margin:0;padding:0}
li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
li.done{background:var(--done)}
.top{display:flex;align-items:center;gap:14px}
.check{width:60px;height:60px;flex:none;border-radius:14px;font-size:26px;font-weight:700;padding:0}
li.done .check{background:transparent;color:var(--green);border:2px solid var(--green)}
.info{flex:1;min-width:0}
.name{font-weight:600;word-break:break-word}
li.done .name{color:var(--soft)}
.sub{display:block;font-size:14px;color:var(--soft)}
.sub b{color:var(--green)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-left:74px}
.acts .ghost,.acts select{padding:8px 12px;font-size:14px}
.acts select{border-width:1px;max-width:140px;color:var(--soft)}
.acts .del,.danger{color:var(--danger)}
.ghost:disabled{opacity:.35}
li.p1{border-left:8px solid var(--p1);background:var(--p1bg)}
li.p2{border-left:8px solid var(--p2);background:var(--p2bg)}
li.p1 .check{background:var(--p1)}
li.p2 .check{background:var(--p2)}
.sechead.p1{border-left:8px solid var(--p1);background:var(--p1bg)}
.sechead.p2{border-left:8px solid var(--p2);background:var(--p2bg)}
.pr.p1,.pr.p1 b{color:var(--p1)}
.pr.p2,.pr.p2 b{color:var(--p2)}
.ghost.pbtn.p1{border-color:var(--p1);color:var(--p1);font-weight:700}
.ghost.pbtn.p2{border-color:var(--p2);color:var(--p2);font-weight:700}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast[hidden]{display:none}
#toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#toast button{background:transparent;color:inherit;border:1px solid currentColor;padding:10px 16px}
.modebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;color:var(--soft);font-size:14px}
.modebar .ghost.on{background:var(--green);color:#fff;border-color:var(--green)}
li.ordli{display:flex;align-items:center;gap:12px}
li.ordli .name{flex:1}
li.ordli small{color:var(--soft);font-weight:500}
.ord{display:flex;gap:6px;flex:none}
.ord .ghost{padding:0;width:48px;height:48px;font-size:20px}
.note{background:var(--card);border-left:4px solid var(--soft);border-radius:8px;padding:8px 12px;margin:0 0 8px;font-size:15px;word-break:break-word}
.sub.cm{color:var(--ink);font-style:italic;word-break:break-word}
.sync{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.sync summary{font-weight:600;cursor:pointer}.sync summary span{font-weight:500;font-size:13px;color:var(--soft);margin-left:6px}.sync label{display:block;font-size:14px;color:var(--soft);margin-top:10px}.sync input{width:100%;padding:10px}.sync .row{display:flex;gap:8px;margin-top:12px}
.empty{text-align:center;color:var(--soft);padding:12px 0 18px;font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.tools .danger{margin-left:auto}
</style>
</head>
<body>
<main>
  <div class="tabs" id="tabs"></div>
  <h1 id="title"></h1>
  <p class="count" id="count"></p>
  <div class="add" id="addbox">
    <input type="text" id="new" placeholder="Ex : Tilleul 8/10" autocomplete="off">
    <input type="number" id="qty" value="1" min="1" inputmode="numeric" aria-label="Quantité">
    <select id="sec" aria-label="Section"></select>
    <button id="addBtn">Ajouter</button>
  </div>
  <div class="modebar"><span id="hint"></span><span style="display:flex;gap:8px">
    <button class="ghost" id="hideBtn"></button><button class="ghost" id="ordBtn">Réorganiser</button></span></div>
  <div id="list"></div>
  <div class="tools">
    <button class="ghost" id="secBtn">Nouvelle section</button>
    <button class="ghost" id="exportBtn">Exporter le journal complet</button>
    <button class="ghost" id="histBtn">Historique</button>
    <button class="ghost danger" id="resetBtn">Archiver les terminés</button>
  </div>
  <details class="sync"><summary>Synchronisation GitHub <span id="syncst">non configurée</span></summary>
    <label>Dépôt de données (utilisateur/nom)<input id="cfgRepo" placeholder="moncompte/arrachage-donnees" autocapitalize="off" autocomplete="off"></label>
    <label>Jeton d'accès (limité à ce dépôt)<input id="cfgToken" type="password" autocomplete="off"></label>
    <label>Nom de cet appareil<input id="cfgDev" autocapitalize="off" autocomplete="off"></label>
    <div class="row"><button id="syncSave">Enregistrer et synchroniser</button><button class="ghost" id="syncNow">Synchroniser</button></div></details>
  <div id="toast" hidden></div>
</main>
<script>
const OLDKEY='arrachage-v1',OPSKEY='arrachage-ops',UIKEY='arrachage-ui',CFGKEY='arrachage-sync';
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const s=localStorage.getItem(k);return s?JSON.parse(s):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TABS=[
 {n:'Arrachage',t:'À arracher',v:'arraché',vi:'arracher',act:'arraché'},
 {n:'Au dépôt',t:'Au dépôt',v:'ramené',vi:'ramener',act:'ramené au dépôt'},
 {n:'Dispatch',t:'Dispatch',v:'dispatché',vi:'dispatcher',act:'dispatché'}];
const PL=['Normale','Haute','Urgente'];
let UI=Object.assign({hist:0,tab:0,hide:[false,false,false],col:{}},ld(UIKEY,{}));
let CFG=Object.assign({repo:'',token:'',dev:''},ld(CFGKEY,{}));
if(!CFG.dev){CFG.dev='tel-'+Math.random().toString(36).slice(2,6);sv(CFGKEY,CFG)}
let OPS=ld(OPSKEY,[]),S={sections:[],items:[],log:[]},T=UI.tab,cur='gen',ordering=false,toastId=null,toastTimer=null,lastT=0;
OPS.forEach(o=>{if(o.dev===CFG.dev)lastT=Math.max(lastT,o.t)});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=iso=>{const d=new Date(iso);return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'})+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};
const sec=id=>S.sections.find(s=>s.id===id)||{};
const cap=(i,t)=>t?i.st[t-1].length:i.qty;
const got=(i,t)=>i.st[t].length;
const avail=(i,t)=>cap(i,t)-got(i,t);
const fini=(i,t)=>avail(i,t)<=0;
const shown=(i,t)=>cap(i,t)>0;
const lastDone=i=>{const l=i.st[2];return l.length?+new Date(l[l.length-1]):i.arch};
const live=i=>!i.arch||(UI.hist>0&&Date.now()-lastDone(i)<=UI.hist*864e5);
const items=()=>S.items.filter(live);

// ---- Moteur : l'état est reconstruit en rejouant toutes les opérations (tous téléphones) dans l'ordre chronologique
function reduce(o){
  const a=o.a,iso=new Date(o.t).toISOString();
  const item=id=>S.items.find(i=>i.id===id);
  const L=(act,it,qty)=>S.log.push({t:iso,dev:o.dev||'',iid:it?it.id:'',action:act,section:it?sec(it.sectionId).name||'':'',item:it?it.name:'',qty});
  const LS=(act,s)=>S.log.push({t:iso,dev:o.dev||'',action:act,section:s.name,item:'',qty:''});
  let x,s;
  switch(o.ty){
  case 'secadd':if(!sec(a.sid).id){s={id:a.sid,name:a.name};S.sections.push(s);if(o.id!=='init')LS('section ajoutée',s)}break;
  case 'secren':if(s=sec(a.sid),s.id){s.name=a.name;LS('section renommée',s)}break;
  case 'snote':if(s=sec(a.sid),s.id){s.note=a.note;LS('commentaire modifié',s)}break;
  case 'sprio':if(s=sec(a.sid),s.id){s.prio=a.p;LS('priorité → '+PL[a.p],s)}break;
  case 'secdel':if(s=sec(a.sid),s.id){S.items.filter(i=>i.sectionId===s.id).forEach(i=>L('supprimé',i,i.qty));
    S.items=S.items.filter(i=>i.sectionId!==s.id);S.sections=S.sections.filter(z=>z!==s);LS('section supprimée',s)}break;
  case 'secswap':{const A=S.sections,i=A.findIndex(z=>z.id===a.x),j=A.findIndex(z=>z.id===a.y);if(i>=0&&j>=0)[A[i],A[j]]=[A[j],A[i]]}break;
  case 'add':if(!item(a.iid)&&sec(a.sid).id){x={id:a.iid,name:a.name,qty:a.qty,sectionId:a.sid,st:[[],[],[]]};S.items.push(x);L('ajout',x,a.qty)}break;
  case 'del':if(x=item(a.iid)){L('supprimé',x,x.qty);S.items=S.items.filter(z=>z!==x)}break;
  case 'qty':if((x=item(a.iid))&&a.qty>=x.st[0].length){x.qty=a.qty;if(!(got(x,2)>=x.qty))delete x.arch;L('quantité modifiée',x,a.qty)}break;
  case 'move':if((x=item(a.iid))&&sec(a.sid).id){x.sectionId=a.sid;L('déplacé',x,x.qty)}break;
  case 'prio':if(x=item(a.iid)){x.prio=a.p;L('priorité → '+PL[a.p],x,x.qty)}break;
  case 'note':if(x=item(a.iid)){x.note=a.note;L('commentaire modifié',x,x.qty)}break;
  case 'itswap':{const A=S.items,i=A.findIndex(z=>z.id===a.x),j=A.findIndex(z=>z.id===a.y);if(i>=0&&j>=0)[A[i],A[j]]=[A[j],A[i]]}break;
  case 'ok':if((x=item(a.iid))&&avail(x,a.st)>0){x.st[a.st].push(iso);L(TABS[a.st].act,x,1)}break;
  case 'undo':if((x=item(a.iid))&&got(x,a.st)&&!(a.st<2&&got(x,a.st+1)>=got(x,a.st))){x.st[a.st].pop();delete x.arch;L('annulé '+TABS[a.st].n.toLowerCase(),x,1)}break;
  case 'archive':(a.ids||[]).forEach(id=>{const z=item(id);if(z&&!z.arch&&got(z,2)>=z.qty){z.arch=o.t;L('archivé',z,z.qty)}});break;
  case 'import':if(!S.items.length){S.sections=a.sections;S.items=a.items;S.log=(a.log||[]).concat(S.log)}break;
  }
}
function rebuild(){
  const all=[{id:'init',t:0,ty:'secadd',a:{sid:'gen',name:'Général'}},...OPS].sort((x,y)=>x.t-y.t||(x.id<y.id?-1:1));
  S={sections:[],items:[],log:[]};all.forEach(o=>{try{reduce(o)}catch(e){}});
  if(!sec(cur).id)cur=S.sections[0]?S.sections[0].id:'gen';
}
function op(ty,a){
  lastT=Math.max(Date.now(),lastT+1);
  OPS.push({id:uid(),t:lastT,dev:CFG.dev,ty,a});sv(OPSKEY,OPS);rebuild();render();schedSync();
}
const saveUI=()=>{UI.tab=T;sv(UIKEY,UI)};

// ---- Synchronisation GitHub (un fichier d'opérations par téléphone dans le dépôt de données)
const hd=raw=>({Authorization:'Bearer '+CFG.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
let syncing=false,again=false,syncTimer=null;
function status(m,err){const e=$('syncst');e.textContent=m;e.style.color=err?'var(--danger)':''}
function schedSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),3000)}
async function sync(manual){
  if(!CFG.repo||!CFG.token){if(manual)status('Renseignez le dépôt et le jeton.',1);return}
  if(syncing){again=true;return}
  syncing=true;
  try{
    status('Synchronisation…');
    const base='https://api.github.com/repos/'+CFG.repo+'/contents/ops';
    const r=await fetch(base+'?_='+Date.now(),{headers:hd(),cache:'no-store'});
    let files=[];
    if(r.status!==404){if(!r.ok)throw new Error('GitHub '+r.status+(r.status===401?' : jeton invalide':r.status===403?' : accès refusé':''));files=await r.json()}
    const known=new Set(OPS.map(o=>o.id));let added=0,remoteOwn=new Set(),mf=null;
    for(const f of files){
      if(!f.name.endsWith('.json'))continue;
      const rr=await fetch(f.url,{headers:hd(true),cache:'no-store'});if(!rr.ok)continue;
      const arr=await rr.json();
      if(f.name===CFG.dev+'.json'){mf=f;arr.forEach(o=>remoteOwn.add(o.id))}
      arr.forEach(o=>{if(!known.has(o.id)){known.add(o.id);OPS.push(o);added++}});
    }
    const mine=OPS.filter(o=>o.dev===CFG.dev).sort((x,y)=>x.t-y.t);
    if(mine.some(o=>!remoteOwn.has(o.id))){
      const body={message:'maj '+CFG.dev,content:b64(JSON.stringify(mine))};if(mf)body.sha=mf.sha;
      const p=await fetch(base+'/'+CFG.dev+'.json',{method:'PUT',headers:hd(),body:JSON.stringify(body)});
      if(p.status===409||p.status===422){again=true}
      else if(!p.ok)throw new Error('Envoi refusé ('+p.status+') : vérifiez les droits du jeton');
    }
    sv(OPSKEY,OPS);if(added){rebuild();render()}
    const cour=S.log.filter(l=>{if(!l.iid)return true;const z=S.items.find(i=>i.id===l.iid);return z&&!z.arch});
    for(const [name,rows] of [['journal-en-cours.csv',cour],['journal-complet.csv',S.log]]){
      try{ // journaux lisibles, régénérés à partir de toutes les opérations
        const csv=csvText(rows),jurl='https://api.github.com/repos/'+CFG.repo+'/contents/'+name;
        const sg=(CFG.jsig&&typeof CFG.jsig==='object')?CFG.jsig:{};
        const jr=await fetch(jurl+'?_='+Date.now(),{headers:hd(),cache:'no-store'});
        let sha,same=false;
        if(jr.ok){const m=await jr.json();sha=m.sha;same=m.content?(decodeURIComponent(escape(atob(m.content)))===csv):(sg[name]===csv.length)}
        if(!same&&S.log.length){
          const body={message:name+' '+CFG.dev,content:b64(csv)};if(sha)body.sha=sha;
          const jp=await fetch(jurl,{method:'PUT',headers:hd(),body:JSON.stringify(body)});
          if(jp.status===409||jp.status===422)again=true;else if(jp.ok){sg[name]=csv.length;CFG.jsig=sg;sv(CFGKEY,CFG)}
        }
      }catch(e){}
    }
    status('Synchronisé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    status(navigator.onLine&&e.message&&!/fetch/i.test(e.message)?e.message:'Hors connexion : envoi différé',1);
  }finally{syncing=false;if(again){again=false;setTimeout(sync,1500)}}
}

// ---- Affichage
function view(s,all){
  const l=items().filter(i=>i.sectionId===s.id&&shown(i,T));
  const l2=(UI.hide[T]&&!ordering&&!all)?l.filter(i=>!fini(i,T)):l;
  return [...l2.filter(i=>!fini(i,T)),...l2.filter(i=>fini(i,T))];
}
function itemHTML(i){
  const n=got(i,T),av=avail(i,T),fn=av<=0,last=i.st[T][n-1],V=TABS[T];
  const own=i.prio||0,sp=sec(i.sectionId).prio||0,ef=Math.max(own,sp),pc=(!fn&&ef)?'p'+ef:'';
  if(ordering){
    const sib=view(sec(i.sectionId),true),k=sib.indexOf(i);
    return `<li class="ordli ${pc}"><span class="name">${esc(i.name)} <small>× ${i.qty}${fn?' · terminé':''}</small></span><div class="ord">
      <button class="ghost" data-itup="${i.id}" ${(k===0||fini(sib[k-1],T)!==fn)?'disabled':''} aria-label="Monter">▲</button>
      <button class="ghost" data-itdown="${i.id}" ${(k===sib.length-1||fini(sib[k+1],T)!==fn)?'disabled':''} aria-label="Descendre">▼</button></div></li>`;
  }
  const opts=S.sections.map(s=>`<option value="${s.id}" ${s.id===i.sectionId?'selected':''}>${esc(s.name)}</option>`).join('');
  const lock=T<2&&got(i,T+1)>=n;
  return `<li class="${fn?'done':pc}"><div class="top">
    <button class="check" data-ok="${i.id}" ${fn?'disabled':''} aria-label="Valider un arbre">${fn?'✓':av}</button>
    <div class="info"><span class="name">${esc(i.name)}</span>
    ${i.note?`<span class="sub cm">💬 ${esc(i.note)}</span>`:''}
    <span class="sub"><b>${n}</b> sur ${i.qty} ${V.v}${n>1?'s':''}${fn?(n<i.qty?' · en attente':''):' · '+av+' à '+V.vi}</span>
    ${pc?`<span class="sub pr ${pc}"><b>Priorité ${PL[ef].toLowerCase()}</b>${sp>own?' (section)':''}</span>`:''}
    ${last?`<span class="sub">Dernier : ${fmt(last)}</span>`:''}
    ${i.arch?`<span class="sub">📦 Archivé le ${fmt(i.arch)}</span>`:''}</div></div>
    <div class="acts"><button class="ghost" data-undo="${i.id}" ${(n&&!lock)?'':'disabled'}>Annuler le dernier</button>
    <button class="ghost pbtn p${own}" data-prio="${i.id}">Priorité : ${PL[own].toLowerCase()}</button>
    <button class="ghost" data-note="${i.id}">${i.note?'Modifier le commentaire':'Commentaire'}</button>
    ${T===0?`<button class="ghost" data-qty="${i.id}">Quantité</button>
    <select data-move="${i.id}" aria-label="Changer de section">${opts}</select>
    <button class="ghost del" data-del="${i.id}">Supprimer</button>`:''}</div></li>`;
}
function render(){
  const V=TABS[T];
  $('tabs').innerHTML=TABS.map((x,k)=>{
    const a=items().reduce((s,i)=>s+Math.max(0,avail(i,k)),0);
    return `<button class="${k===T?'on':''}" data-tab="${k}">${x.n}<small>${a} à ${x.vi}</small></button>`}).join('');
  $('title').textContent=V.t;
  const capT=items().reduce((s,i)=>s+cap(i,T),0),fait=items().reduce((s,i)=>s+got(i,T),0);
  $('count').textContent=items().length?fait+' '+V.v+(fait>1?'s':'')+' sur '+capT+(T?' '+TABS[T-1].v+(capT>1?'s':''):'')+' · reste '+(capT-fait):'';
  $('addbox').style.display=T===0?'flex':'none';
  $('secBtn').style.display=T===0?'':'none';
  const nDone=items().filter(i=>shown(i,T)&&fini(i,T)).length;
  $('histBtn').textContent=UI.hist>0?'Historique : '+UI.hist+' j':'Historique';
  $('hideBtn').textContent=UI.hide[T]?'Afficher terminés'+(nDone?' ('+nDone+')':''):'Masquer terminés';
  $('hideBtn').classList.toggle('on',!!UI.hide[T]);
  $('ordBtn').textContent=ordering?'Terminé':'Réorganiser';
  $('ordBtn').classList.toggle('on',ordering);
  $('hint').textContent=ordering?'Utilisez ▲ ▼ pour changer l\'ordre.':'';
  $('sec').innerHTML=S.sections.map(s=>`<option value="${s.id}" ${s.id===cur?'selected':''}>${esc(s.name)}</option>`).join('');
  $('list').innerHTML=S.sections.map(s=>{
    const its=items().filter(i=>i.sectionId===s.id&&shown(i,T));
    if(T>0&&!its.length)return '';
    const t=its.reduce((a,i)=>a+cap(i,T),0),f=its.reduce((a,i)=>a+got(i,T),0),sp=s.prio||0,vis=view(s),k=S.sections.indexOf(s),col=UI.col[s.id];
    return `<div class="sechead ${sp?'p'+sp:''}"><button class="tog" data-toggle="${s.id}" aria-expanded="${!col}">
      <span>${col?'▸':'▾'}</span><span class="nm">${esc(s.name)}</span><small>${f}/${t}</small></button>
      ${ordering?`<div class="ord"><button class="ghost" data-secup="${s.id}" ${k===0?'disabled':''} aria-label="Monter la section">▲</button>
      <button class="ghost" data-secdown="${s.id}" ${k===S.sections.length-1?'disabled':''} aria-label="Descendre la section">▼</button></div>`
      :`<button class="ghost pbtn p${sp}" data-sprio="${s.id}" aria-label="Changer la priorité de la section">${PL[sp]}</button>
      <button class="ghost" data-snote="${s.id}" aria-label="Commentaire de la section">💬</button>`
      +(T===0?`<button class="ghost" data-rename="${s.id}" aria-label="Renommer la section">✎</button>
      <button class="ghost danger" data-delsec="${s.id}" aria-label="Supprimer la section">×</button>`:'')}</div>`
      +(s.note?`<p class="note">💬 ${esc(s.note)}</p>`:'')
      +(col?'':!its.length?'<p class="empty">Aucune ligne dans cette section.</p>'
        :!vis.length?'<p class="empty">Toutes les lignes sont terminées.</p>'
        :`<ul>${vis.map(itemHTML).join('')}</ul>`);
  }).join('');
}

// ---- Actions
function add(){
  const v=$('new').value.trim();if(!v)return;
  cur=$('sec').value;UI.col[cur]=false;saveUI();
  op('add',{iid:uid(),name:v,qty:Math.max(1,parseInt($('qty').value)||1),sid:cur});
  $('new').value='';$('qty').value=1;
}
$('addBtn').onclick=add;
$('new').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('sec').onchange=e=>{cur=e.target.value};
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;T=+b.dataset.tab;ordering=false;$('toast').hidden=true;saveUI();render()};
$('ordBtn').onclick=()=>{ordering=!ordering;render()};
$('hideBtn').onclick=()=>{UI.hide[T]=!UI.hide[T];$('toast').hidden=true;saveUI();render()};
$('secBtn').onclick=()=>{
  const n=(prompt('Nom de la nouvelle section (ex : Parcelle A)')||'').trim();if(!n)return;
  cur=uid();op('secadd',{sid:cur,name:n});
};
function showToast(id,name){
  toastId=id;$('toast').innerHTML='<span>« '+esc(name)+' » terminé</span><button>Annuler</button>';
  $('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').hidden=true},7000);
}
$('toast').onclick=e=>{
  if(!e.target.closest('button'))return;
  op('undo',{iid:toastId,st:T});$('toast').hidden=true;
};
$('list').addEventListener('change',e=>{
  const id=e.target.dataset.move;if(id)op('move',{iid:id,sid:e.target.value});
});
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const item=id=>S.items.find(i=>i.id===id),d=b.dataset;
  if(d.toggle){UI.col[d.toggle]=!UI.col[d.toggle];saveUI();render()}
  else if(d.rename){const s=sec(d.rename),n=(prompt('Nouveau nom de la section',s.name)||'').trim();if(n)op('secren',{sid:s.id,name:n})}
  else if(d.delsec){
    const s=sec(d.delsec);
    if(S.sections.length<2){alert('Impossible de supprimer la dernière section.');return}
    const c=S.items.filter(i=>i.sectionId===s.id).length;
    if(confirm('Supprimer la section « '+s.name+' »'+(c?' et ses '+c+' ligne'+(c>1?'s':'')+' (avec leur suivi dans les 3 volets)':'')+' ?'))op('secdel',{sid:s.id});
  }
  else if(d.prio){const it=item(d.prio);op('prio',{iid:it.id,p:((it.prio||0)+1)%3})}
  else if(d.sprio){const s=sec(d.sprio);op('sprio',{sid:s.id,p:((s.prio||0)+1)%3})}
  else if(d.note||d.snote){
    const o=d.note?item(d.note):sec(d.snote);
    const r=prompt('Commentaire sur '+(d.note?'« ':'la section « ')+o.name+' » (laisser vide pour effacer)',o.note||'');if(r===null)return;
    op(d.note?'note':'snote',d.note?{iid:o.id,note:r.trim()}:{sid:o.id,note:r.trim()});
  }
  else if(d.secup||d.secdown){
    const A=S.sections,k=A.findIndex(s=>s.id===(d.secup||d.secdown)),j=k+(d.secup?-1:1);
    if(j>=0&&j<A.length)op('secswap',{x:A[k].id,y:A[j].id});
  }
  else if(d.itup||d.itdown){
    const it=item(d.itup||d.itdown),sib=view(sec(it.sectionId),true),o=sib[sib.indexOf(it)+(d.itup?-1:1)];
    if(o)op('itswap',{x:it.id,y:o.id});
  }
  else if(d.ok){
    const it=item(d.ok);if(avail(it,T)<=0)return;
    const id=it.id,name=it.name,last=avail(it,T)===1;
    op('ok',{iid:id,st:T});
    if(UI.hide[T]&&last)showToast(id,name);
  }
  else if(d.undo)op('undo',{iid:d.undo,st:T});
  else if(d.qty){
    const it=item(d.qty),min=Math.max(1,got(it,0));
    const r=prompt('Quantité totale pour « '+it.name+' » (minimum '+min+')',it.qty);if(r===null)return;
    const n=parseInt(r);if(!(n>=min)){alert('Quantité invalide : elle ne peut pas être inférieure au nombre déjà arraché.');return}
    op('qty',{iid:it.id,qty:n});
  }
  else if(d.del){const it=item(d.del);if(confirm('Supprimer « '+it.name+' » (avec son suivi dans les 3 volets) ?'))op('del',{iid:it.id})}
});
function csvText(rows){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  return '\ufeff'+['horodatage;date;heure;action;section;arbre;quantité;appareil'].concat(rows.map(l=>{
    const d=new Date(l.t);
    return [l.t,d.toLocaleDateString('fr-FR'),d.toLocaleTimeString('fr-FR'),l.action,q(l.section||''),q(l.item),l.qty===undefined?1:l.qty,l.dev||''].join(';');
  })).join('\n');
}
$('exportBtn').onclick=()=>{
  if(!S.log.length){alert('Le journal est vide.');return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csvText(S.log)],{type:'text/csv'}));
  a.download='journal-arrachage.csv';a.click();
};
$('resetBtn').onclick=()=>{
  const ids=S.items.filter(i=>!i.arch&&got(i,2)>=i.qty).map(i=>i.id);
  if(!ids.length){alert('Aucune ligne entièrement terminée (arrachée, ramenée et dispatchée) à archiver.');return}
  if(confirm('Archiver '+ids.length+' ligne'+(ids.length>1?'s':'')+' terminée'+(ids.length>1?'s':'')+' ?\nElles disparaissent de la liste de tous les téléphones et du journal en cours, mais restent dans le journal complet.'))op('archive',{ids});
};
$('histBtn').onclick=()=>{
  const r=prompt('Afficher les lignes archivées terminées depuis X jours (0 pour masquer)',UI.hist||7);if(r===null)return;
  UI.hist=Math.max(0,parseInt(r)||0);saveUI();render();
};
$('syncSave').onclick=()=>{
  CFG.repo=$('cfgRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,'');
  CFG.token=$('cfgToken').value.trim();
  CFG.dev=($('cfgDev').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'')||CFG.dev);
  sv(CFGKEY,CFG);$('cfgRepo').value=CFG.repo;$('cfgDev').value=CFG.dev;sync(true);
};
$('syncNow').onclick=()=>sync(true);
$('cfgRepo').value=CFG.repo;$('cfgToken').value=CFG.token;$('cfgDev').value=CFG.dev;

// ---- Démarrage
rebuild();
if(!OPS.length){
  const old=ld(OLDKEY,null);
  if(old&&old.items&&old.items.length&&confirm('Importer vos données existantes dans cette version ?\n(À faire sur UN SEUL téléphone.)')){
    const items=old.items.map(i=>{i.qty=i.qty||1;if(!Array.isArray(i.st)){i.st=[Array.isArray(i.done)?i.done:(i.doneAt?Array(i.qty).fill(i.doneAt):[]),[],[]];delete i.done;delete i.doneAt}return i});
    const secs=(old.sections&&old.sections.length)?old.sections:[{id:'gen',name:'Général'}];
    items.forEach(i=>{if(!secs.some(s=>s.id===i.sectionId))i.sectionId=secs[0].id});
    op('import',{sections:secs,items,log:old.log||[]});
  }
}
render();sync();
setInterval(()=>sync(),45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
window.addEventListener('online',()=>sync());
</script>
</body>
</html>
